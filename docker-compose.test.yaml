version: '3.8'

services:
  postgres-test:
    image: postgres:16-alpine
    container_name: template-postgres-test
    ports:
      - '5433:5432'
    environment:
      POSTGRES_USER: template_test
      POSTGRES_PASSWORD: test_password
      POSTGRES_DB: template_test
    volumes:
      - postgres-test-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U template_test -d template_test']
      interval: 5s
      timeout: 5s
      retries: 5

  redis-test:
    image: redis:7-alpine
    container_name: template-redis-test
    command: redis-server --requirepass test_redis_password
    ports:
      - '6380:6379'
    volumes:
      - redis-test-data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', '-a', 'test_redis_password', 'ping']
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres-test-data:
  redis-test-data:
